aid: tone
name: Tone
description: 'Tone is a full-stack royalty management platform for music rights owners
  — independent labels, distributors, and royalty teams. It centralizes royalty accounting,
  income tracking, and contract management, then pays artists directly through integrated
  global payouts. The platform processes large royalty periods quickly, provides near-real-time
  sales intelligence with timeline views and customizable charts, models deal structures
  with a contract simulator (reserves, deductions, escalations), automatically associates
  costs with the applicable royalty periods, and gives artists transparent dashboards into
  their earnings. In-app artist payouts are powered by Airwallex for secure multi-currency
  international payments, letting labels pay artists and partners worldwide without juggling
  separate banking tools. Tone is backed by QED Investors. This profile was added to the API
  Evangelist network from a VC-portfolio lead; Tone is a SaaS application and does not currently
  publish a public developer API, OpenAPI specification, or developer portal.'
